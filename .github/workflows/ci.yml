name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only what ships in the .vsix; dev tools (vsce, eslint) are not bundled.
      - name: Audit runtime dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests (VS Code 1.85)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/integration/runTest.mjs

      - name: Integration tests (VS Code 1.85)
        if: runner.os != 'Linux'
        run: node test/integration/runTest.mjs

      - name: Package extension
        if: runner.os == 'Linux'
        run: npx vsce package --out minify-companion.vsix

      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: minify-companion-vsix
          path: minify-companion.vsix
          retention-days: 14
